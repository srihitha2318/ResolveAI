# Render Blueprint Specification for ResolveAI
# -----------------------------------------------------------------------------
# Documentation: https://render.com/docs/blueprint-spec
#
# IMPORTANT NOTES ON DATA PERSISTENCE:
# Render Free Web Services use ephemeral container filesystems.
# When the free container spins down or redeploys, SQLite and ChromaDB data
# in ./data will reset to initial seeded demo data.
#
# For persistent production storage:
# Add a Render Persistent Disk mounted at /var/data and configure:
#   DATABASE_URL=sqlite:////var/data/resolveai.db
#   CHECKPOINT_DB_PATH=/var/data/checkpoints.db
#   VECTOR_STORE_DIR=/var/data/vector_store
# -----------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: resolveai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: ResolveAI
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: AUTH_DEV_MODE_FALLBACK
        value: "false"
      - key: SLA_STANDARD_HOURS
        value: "12"
      - key: SLA_HIGH_VALUE_HOURS
        value: "4"
      - key: LLM_PROVIDER
        value: none
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://127.0.0.1:3000"]'
      - key: FRONTEND_URL
        fromService:
          type: web
          name: resolveai-frontend
          property: url

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: resolveai-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resolveai-backend
          property: url
